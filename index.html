<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">UFO/UAP 解密档案交互地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="topbar">
  <h1><span data-i18n="header_title">🛸 UFO/UAP 解密档案交互地图</span></h1>
  <div id="topbar-right">
    <div id="meta">
      <span id="event-count">…</span> <span data-i18n="meta_events">事件</span> ·
      <span id="batch-count">—</span> <span data-i18n="meta_batches">批次</span> ·
      <span data-i18n="meta_source">数据源</span>：<a href="https://www.war.gov/UFO/" target="_blank" rel="noopener">DoW UAP Releases</a>
    </div>
    <div id="lang-toggle" role="group" aria-label="Language toggle">
      <button data-lang="zh" class="lang-btn active">中</button>
      <button data-lang="en" class="lang-btn">EN</button>
    </div>
  </div>
</div>

<div id="sidebar">
  <h2 data-i18n="sidebar_title">筛选器 / Filters</h2>

  <div class="filter-group">
    <label data-i18n="filter_date_range">时间范围：</label>
    <div class="date-range">
      <input type="text" id="date-min" placeholder="YYYY" maxlength="4">
      <span>—</span>
      <input type="text" id="date-max" placeholder="YYYY" maxlength="4">
    </div>
  </div>

  <div class="filter-group">
    <label data-i18n="filter_agency">报告机构：</label>
    <div id="agency-checkboxes"></div>
  </div>

  <div class="filter-group">
    <label data-i18n="filter_type">UAP 类型：</label>
    <div id="type-checkboxes"></div>
  </div>

  <div class="filter-group">
    <label data-i18n="filter_layers">显示图层：</label>
    <label class="cb"><input type="checkbox" id="show-heatmap" checked> <span data-i18n="layer_heatmap">人类活动 heatmap</span></label>
    <div id="heat-opacity-wrap" style="margin: 2px 0 8px 22px;">
      <label style="font-size: 11px; color: #8fa3c4; display: block;">
        <span data-i18n="layer_intensity">强度</span>：<span id="heat-opacity-val">40%</span>
        <input type="range" id="heat-opacity" min="5" max="100" value="40" step="5"
               style="width: 100%; margin-top: 2px;">
      </label>
    </div>
    <label class="cb"><input type="checkbox" id="show-markers" checked> <span data-i18n="layer_markers">事件标点</span></label>
    <label class="cb"><input type="checkbox" id="cluster-markers" checked> <span data-i18n="layer_cluster">聚合相邻点</span></label>
  </div>

  <div class="filter-group" id="stats-panel">
    <label data-i18n="stats_visible">当前显示：</label>
    <div id="visible-count">—</div>
    <details>
      <summary data-i18n="stats_by_region">按地区统计</summary>
      <div id="region-stats"></div>
    </details>
  </div>

  <hr>
  <p class="footer">
    <span data-i18n="footer_version">站点版本</span>：v1.0<br>
    <span data-i18n="footer_built">生成日期</span>：2026-05-11<br>
    <a href="about.html" data-i18n="footer_about">关于本站 / About</a>
    <span id="visitor-counter" class="visitor-counter" aria-live="polite"></span>
  </p>
</div>

<div id="map"></div>

<div id="detail-panel" class="hidden">
  <button id="detail-close" title="Close">×</button>
  <div id="detail-content"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<script src="js/i18n.js"></script>
<script src="js/visitor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
