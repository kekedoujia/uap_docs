<div id="sidebar">
  <h2 data-i18n="sidebar_title">筛选器 / Filters</h2>

  <div class="filter-group">
    <label data-i18n="filter_date_range">时间范围：</label>
    <div class="date-range">
      <input type="text" id="date-min" placeholder="YYYY" maxlength="4">
      <span>—</span>
      <input type="text" id="date-max" placeholder="YYYY" maxlength="4">
    </div>
  </div>

  <div class="filter-group nav-group">
    <a href="timeline.html" class="nav-link" data-i18n="nav_timeline">📅 时间轴视图</a>
    <a href="reports.html" class="nav-link" data-i18n="nav_reports">📑 按报告索引</a>
    <a href="recent-updates.html" class="nav-link" data-i18n="nav_recent_updates">🔔 最近更新</a>
    <a href="about.html" class="nav-link" data-i18n="nav_about">ℹ️ 关于本站</a>
    <button id="other-events-btn" type="button" class="open-modal-btn">
      <span>✦</span>
      <span data-i18n="other_events_title">其他事件（外太空 / 无具体地点）</span>
      <span class="other-events-badge">(<span id="other-events-count">0</span>)</span>
    </button>
  </div>

  <div class="filter-group">
    <label data-i18n="filter_source">数据源：</label>
    <div id="source-checkboxes"></div>
  </div>

  <div class="filter-group">
    <label data-i18n="filter_agency">报告机构：</label>
    <div id="agency-checkboxes"></div>
  </div>

  <div class="filter-group">
    <label data-i18n="filter_layers">显示图层：</label>
    <label class="cb"><input type="checkbox" id="show-heatmap" checked> <span data-i18n="layer_heatmap">人类活动 heatmap</span></label>
    <div id="heat-opacity-wrap" style="margin: 2px 0 8px 22px;">
      <label style="font-size: 11px; color: #8fa3c4; display: block;">
        <span data-i18n="layer_intensity">强度</span>：<span id="heat-opacity-val">30%</span>
        <input type="range" id="heat-opacity" min="5" max="100" value="30" step="5"
               style="width: 100%; margin-top: 2px;">
      </label>
    </div>
    <label class="cb"><input type="checkbox" id="show-markers" checked> <span data-i18n="layer_markers">事件标点</span></label>
    <label class="cb"><input type="checkbox" id="cluster-markers" checked> <span data-i18n="layer_cluster">聚合相邻点</span></label>
  </div>

  <div class="filter-group" id="stats-panel">
    <label data-i18n="stats_visible">当前显示：</label>
    <div id="visible-count">—</div>
    <details>
      <summary data-i18n="stats_by_region">按地区统计</summary>
      <div id="region-stats"></div>
    </details>
  </div>

  <hr>
  <p class="footer">
    <span data-i18n="footer_version">站点版本</span>：v1.0<br>
    <span data-i18n="footer_built">生成日期</span>：2026-05-11
    <span id="visitor-counter" class="visitor-counter" aria-live="polite"></span>

    </header>
    <div class="modal-body disclaimer-modal-body" data-i18n="disclaimer_body" data-i18n-html></div>
  </div>
</div>

<div id="other-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="other-modal-title">
  <div class="modal-backdrop" data-modal-close></div>
  <div class="modal-content">
    <header class="modal-header">
      <h2 id="other-modal-title">

    <div class="modal-body">

            <th data-i18n="tl_th_title">标题 / 摘要</th>
            <th data-i18n="tl_th_media">媒体</th>
          </tr>
        </thead>
        <tbody id="other-modal-tbody"></tbody>
      </table>
    </div>
  </div>
