<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">UFO/UAP 解密档案交互地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="topbar">
  <button id="hamburger-btn" type="button" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
  <h1><span data-i18n="header_title">🛸 UFO/UAP 解密档案交互地图</span></h1>
  <div id="topbar-right">
    <div id="meta">
      <span id="event-count">…</span> <span data-i18n="meta_events">事件</span> ·
      <span class="data-source-menu">
        <button id="ds-menu-btn" type="button" aria-haspopup="true" aria-expanded="false">
          📚 <span data-i18n="meta_source">数据源</span> (<span id="ds-menu-count">…</span>) <span class="caret">▾</span>
        </button>
        <div id="ds-menu-panel" class="ds-menu-panel hidden" role="menu"></div>
      </span>
    </div>
    <a href="donate.html" id="donate-btn" class="topbar-donate" data-i18n="nav_donate">☕ 打赏</a>
    <div id="lang-toggle" role="group" aria-label="Language toggle">
      <button data-lang="zh" class="lang-btn active">中</button>
      <button data-lang="en" class="lang-btn">EN</button>
    </div>
  </div>
</div>
<div id="sidebar-backdrop"></div>

<div id="sidebar">
  <h2 data-i18n="sidebar_title">筛选器 / Filters</h2>

  <div class="filter-group">
    <label data-i18n="filter_date_range">时间范围：</label>
    <div class="date-range">
      <input type="text" id="date-min" placeholder="YYYY" maxlength="4">
      <span>—</span>
      <input type="text" id="date-max" placeholder="YYYY" maxlength="4">
    </div>
  </div>

  <div class="filter-group nav-group">
    <a href="timeline.html" class="nav-link" data-i18n="nav_timeline">📅 时间轴视图</a>
    <a href="reports.html" class="nav-link" data-i18n="nav_reports">📑 按报告索引</a>
    <button id="other-events-btn" type="button" class="open-modal-btn">
      <span>✦</span>
      <span data-i18n="other_events_title">其他事件（外太空 / 无具体地点）</span>
      <span class="other-events-badge">(<span id="other-events-count">0</span>)</span>
    </button>
  </div>

  <div class="filter-group">
    <label data-i18n="filter_source">数据源：</label>
    <div id="source-checkboxes"></div>
  </div>

  <div class="filter-group">
    <label data-i18n="filter_agency">报告机构：</label>
    <div id="agency-checkboxes"></div>
  </div>

  <div class="filter-group">
    <label data-i18n="filter_layers">显示图层：</label>
    <label class="cb"><input type="checkbox" id="show-heatmap" checked> <span data-i18n="layer_heatmap">人类活动 heatmap</span></label>
    <div id="heat-opacity-wrap" style="margin: 2px 0 8px 22px;">
      <label style="font-size: 11px; color: #8fa3c4; display: block;">
        <span data-i18n="layer_intensity">强度</span>：<span id="heat-opacity-val">30%</span>
        <input type="range" id="heat-opacity" min="5" max="100" value="30" step="5"
               style="width: 100%; margin-top: 2px;">
      </label>
    </div>
    <label class="cb"><input type="checkbox" id="show-markers" checked> <span data-i18n="layer_markers">事件标点</span></label>
    <label class="cb"><input type="checkbox" id="cluster-markers" checked> <span data-i18n="layer_cluster">聚合相邻点</span></label>
  </div>

  <div class="filter-group" id="stats-panel">
    <label data-i18n="stats_visible">当前显示：</label>
    <div id="visible-count">—</div>
    <details>
      <summary data-i18n="stats_by_region">按地区统计</summary>
      <div id="region-stats"></div>
    </details>
  </div>

  <hr>
  <p class="footer">
    <span data-i18n="footer_version">站点版本</span>：v1.0<br>
    <span data-i18n="footer_built">生成日期</span>：2026-05-11
    <span id="visitor-counter" class="visitor-counter" aria-live="polite"></span>
  </p>

  <button id="disclaimer-btn" type="button" class="open-modal-btn disclaimer-btn">
    <span data-i18n="disclaimer_title">📄 免责声明 / Disclaimer</span>
  </button>
</div>

<div id="map"></div>

<div id="detail-panel" class="hidden">
  <button id="detail-close" title="Close">×</button>
  <div id="detail-content"></div>
</div>

<div id="disclaimer-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="disclaimer-modal-title">
  <div class="modal-backdrop" data-modal-close></div>
  <div class="modal-content modal-content--narrow">
    <header class="modal-header">
      <h2 id="disclaimer-modal-title" data-i18n="disclaimer_title">📄 免责声明 / Disclaimer</h2>
      <button class="modal-close" data-modal-close title="Close">×</button>
    </header>
    <div class="modal-body disclaimer-modal-body" data-i18n="disclaimer_body" data-i18n-html></div>
  </div>
</div>

<div id="other-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="other-modal-title">
  <div class="modal-backdrop" data-modal-close></div>
  <div class="modal-content">
    <header class="modal-header">
      <h2 id="other-modal-title">
        ✦ <span data-i18n="other_events_title">其他事件（外太空 / 无具体地点）</span>
        <span class="modal-count">(<span id="other-modal-count">0</span>)</span>
      </h2>
      <button class="modal-close" data-modal-close title="Close">×</button>
    </header>
    <div class="modal-body">
      <table class="modal-table">
        <thead>
          <tr>
            <th data-i18n="tl_th_date">日期</th>
            <th data-i18n="tl_th_location">地点</th>
            <th data-i18n="tl_th_agency">机构</th>
            <th data-i18n="tl_th_type">类型</th>
            <th data-i18n="tl_th_title">标题 / 摘要</th>
            <th data-i18n="tl_th_media">媒体</th>
          </tr>
        </thead>
        <tbody id="other-modal-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<script src="js/i18n.js"></script>
<script src="js/visitor.js"></script>
<script src="js/version_check.js"></script>
<script src="js/app.js"></script>
</body>
</html>
