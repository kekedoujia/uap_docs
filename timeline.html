<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="timeline_title">UFO/UAP 事件时间轴</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="timeline-page">

<div id="topbar">
  <h1><a href="index.html" class="back-link" data-i18n="timeline_back" title="Map">🛸</a> <span data-i18n="timeline_header">UFO/UAP 事件时间轴</span></h1>
  <div id="topbar-right">
    <div id="meta">
      <a href="index.html" data-i18n="timeline_to_map">🗺 返回地图</a> ·
      <span id="event-count">…</span> <span data-i18n="meta_events">事件</span>
    </div>
    <div id="lang-toggle" role="group" aria-label="Language toggle">
      <button data-lang="zh" class="lang-btn active">中</button>
      <button data-lang="en" class="lang-btn">EN</button>
    </div>
  </div>
</div>
<a href="index.html" id="mobile-fab-back" title="Back to map" aria-label="Back to map">🗺</a>

<div id="timeline-toolbar">
  <div class="tl-filter-cell">
    <label data-i18n="filter_date_range">时间范围：</label>
    <input type="text" id="tl-year-min" placeholder="YYYY" maxlength="4">
    <span>—</span>
    <input type="text" id="tl-year-max" placeholder="YYYY" maxlength="4">
  </div>
  <div class="tl-filter-cell tl-grow">
    <label data-i18n="tl_search">搜索：</label>
    <input type="text" id="tl-search" placeholder="..." data-i18n-placeholder="tl_search_placeholder">
  </div>
  <div class="tl-filter-cell">
    <label data-i18n="filter_source">数据源：</label>
    <select id="tl-source-filter"><option value="">All</option></select>
  </div>
  <div class="tl-filter-cell">
    <label data-i18n="filter_agency">机构：</label>
    <select id="tl-agency-filter"><option value="">All</option></select>
  </div>
  <div class="tl-filter-cell">
    <label data-i18n="tl_visible">显示：</label>
    <span id="tl-visible-count">—</span> / <span id="tl-total-count">—</span>
  </div>
</div>

<div id="timeline-container">
  <div id="timeline-decade-jump" class="tl-decade-jump"></div>
  <div id="timeline-list"></div>
</div>

<div id="detail-panel" class="hidden">
  <button id="detail-close" title="Close">×</button>
  <div id="detail-content"></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/timeline.js"></script>
</body>
</html>
